# Main Street Risk Desk: calm light theme (the CSS in decisiondesk/ui/theme.py builds on it).
[theme]
base = "light"
primaryColor = "#2346D8"
backgroundColor = "#F6F5F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#15171C"
font = "sans serif"

[server]
headless = false   # open the browser automatically on `streamlit run`
port = 8501

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"   # hide the Deploy button during demos
