# Main Street Risk Desk: light editorial theme (the CSS in decisiondesk/ui/theme.py builds on it).
[theme]
base = "light"
primaryColor = "#2346D8"
backgroundColor = "#F3EFE6"
secondaryBackgroundColor = "#FFFDF8"
textColor = "#111111"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"   # hide the Deploy button during demos
