[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "main-street-decision-intelligence"
version = "0.1.0"
description = "HackPrinceton: evidence-based financial and operational decision intelligence starter"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.3", "requests>=2.31", "openpyxl>=3.1", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
ml = ["xgboost>=2", "catboost>=1.2", "statsmodels>=0.14"]
ui = ["streamlit>=1.38"]
agent = ["langchain>=1.0", "langchain-anthropic>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: read-only tests against real FRED / Nessie APIs (MSRD_LIVE=1)"]

[tool.ruff]
line-length = 100
